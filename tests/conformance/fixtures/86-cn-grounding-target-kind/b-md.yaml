ttr: "0.21"
package: "hartland.stores"
model: "md"
defs:
  -
    kind: "dimension"
    id: "Product"
    properties:
      key: "sku"
      attributes:
        -
          id: "sku"
          properties:
            isKey: true
            domain: "md.Sku"
        -
          id: "color"
          properties:
            domain: "md.Color"
  -
    kind: "domain"
    id: "Size"
    properties:
      type: "text"
  -
    kind: "domain"
    id: "Money"
    properties:
      type: "decimal"
  -
    kind: "measure"
    id: "net_sales"
    properties:
      domain: "md.Money"
      aggregation: "sum"
  -
    kind: "cubelet"
    id: "store_sales"
    properties:
      grain:
        - "Product.sku"
