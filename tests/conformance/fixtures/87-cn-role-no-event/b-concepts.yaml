ttr: "0.21"
package: "hartland.stores"
model: "cn"
defs:
  -
    kind: "kind"
    id: "Party"
    properties:
      -
        grounds: "er.entity.party"
  -
    kind: "event"
    id: "StoreVisit"
    properties:
      -
        involves:
          -
            ref: "Party"
      -
        period:
          at:
            ref: "visited_at"
      -
        grounds: "er.entity.store_visit"
  -
    kind: "role"
    id: "Visitor"
    properties:
      -
        of:
          ref: "Party"
      -
        grounds: "er.entity.party"
  -
    kind: "role"
    id: "Guest"
    properties:
      -
        of:
          ref: "Party"
      -
        event: "StoreVisit"
      -
        grounds: "er.entity.party"
