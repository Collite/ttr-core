ttr: "0.21"
package: "hartland.stores"
model: "cn"
defs:
  -
    kind: "kind"
    id: "Party"
    properties:
      -
        grounds: "er.entity.partner"
  -
    kind: "event"
    id: "Purchase"
    properties:
      -
        involves:
          -
            ref: "Customer"
      -
        period:
          at:
            ref: "sold_date"
      -
        grounds: "er.entity.sale"
  -
    kind: "role"
    id: "Customer"
    properties:
      -
        of:
          ref: "Party"
      -
        event: "Purchase"
      -
        grounds: "er.entity.partner"
  -
    kind: "role"
    id: "Shopper"
    properties:
      -
        of:
          ref: "Party"
      -
        event: "Purchase"
      -
        grounds: "er.entity.web_account"
