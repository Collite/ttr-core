# PowerDesigner 16 CDM/LDM/PDM -> cn skeleton, er/db and generation-link binding documents.
# D-MW-109: multidimensional objects are deferred to S5.4b. No PD extension (ttr.xem) semantics are read.
# Model/package Code segments are lower-cased; collisions are refused. Definitions use Code, not local XML ids or display names.
# References keep local XML ids and qualified Code paths (@path) as provenance; links match ObjectID by:sourceName (§66).
# History ORG ids resolve only through the supplied models' GenerationOrigins; unsupplied origins are skipped
# with an ignored-record entry. External shortcuts are followed only within the supplied models.
# TTR-M has no binary primitive: binary spellings map to text. Unknown names also default to text.
# Types are data below: PD logical abbreviations and SQL type spellings map to canonical TTR types.
profile: pdm/16
grammar: '>=0.22 <1.0'
skeleton: true
sourceName: /ObjectID
foreignId: /ObjectID
unknown: ignore
operations:
