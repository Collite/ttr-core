  - {"op": "ignore", "in": "kind", "at": "/@pd", "reason": "PowerDesigner identity, model class and package path (identity is retained by the sidecar)"}
  - {"op": "ignore", "in": "kind", "at": "/ObjectID", "reason": "stable object identity in the sidecar"}
  - {"op": "ignore", "in": "kind", "at": "/Name", "reason": "PD display name; the Code is the generated identifier"}
