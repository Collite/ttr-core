name: Release viewer image

# Builds the Studio Viewer container image (packages/designer/Dockerfile — the read-only Designer
# viewer, catalog mode over Veles; ttr-core#169), smoke-tests it, and pushes it to GHCR as
# ghcr.io/collite/ttr-viewer:<x.y.z> for linux/amd64 + linux/arm64. Tag-driven like every other lane
# in this repo; `just publish viewer [level | set X.Y.Z]` cuts the tag.
#
#   viewer/vX.Y.Z            → ghcr.io/collite/ttr-viewer:X.Y.Z
#   viewer/vX.Y.Z-RELEASE    → the same image tag, bare X.Y.Z. GHCR is this lane's only registry, so
#                              the RELEASE marker gates nothing extra here; it is accepted so the tag
#                              grammar stays the same across lanes (cf. ttr-server's release-image.yml).
#
# The deployment guide is docs-site/docs/operate/studio-viewer.md.
#
# ⚑ CREDENTIALS — the base images. The Dockerfile builds FROM ghcr.io/collite/node and
# ghcr.io/collite/nginx: copies of the Docker official images kept by Collite/ttr-server's
# mirror-base-images.yml (Docker Hub's anonymous pull limit has failed whole release days). Those
# packages are PRIVATE and linked to ttr-server, so this repository's GITHUB_TOKEN can read them only
# after each package grants Collite/ttr-core read access (package settings → Manage Actions access →
# Add repository). Without that grant, set the TATRMAN_PKG_USER / TATRMAN_PKG_TOKEN secrets (a member
# PAT with read:packages + write:packages) — this workflow prefers them when present, as ttr-server's
# lanes do.
#
# ⚑ CREDENTIALS — the pushed package. A package CREATED by this workflow's GITHUB_TOKEN is linked to
# Collite/ttr-core and stays writable from here. A package first pushed with a PAT is linked to no
# repository, and GITHUB_TOKEN is then refused on it for good (ttr-server's release-image.yml has the
# history). New GHCR packages are private: make ttr-viewer public once, after its first push, so
# deployments can pull it without credentials.

on:
  push:
    tags:
      - 'viewer/v*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/collite/ttr-viewer

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: |
          RAW="${GITHUB_REF_NAME##*/v}"
          VERSION="${RAW%-RELEASE}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not derive an x.y.z version from '$GITHUB_REF_NAME'"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag $GITHUB_REF_NAME → ${IMAGE}:${VERSION}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.TATRMAN_PKG_USER != '' && secrets.TATRMAN_PKG_USER || github.actor }}
          password: ${{ secrets.TATRMAN_PKG_TOKEN != '' && secrets.TATRMAN_PKG_TOKEN || secrets.GITHUB_TOKEN }}

      # Build the runner's own platform first and LOAD it, so the smoke test below runs the image
      # before anything is published. The multi-arch push after it reuses this build's cache.
      - name: Build (linux/amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/designer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ttr-viewer:smoke
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The contract a deployment relies on: healthz, the base path written into the document and the
      # config, deep links answered with the SPA document, assets under the base, the catalog proxy
      # refusing what is not a read route, and a non-root process.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name viewer -p 8080:8080 -e VIEWER_BASE_PATH=/models/ -e VIEWER_DEFAULT_LANG=en -e VIEWER_LAYOUT_FORMAT=ttr ttr-viewer:smoke
          trap 'docker logs viewer; docker rm -f viewer >/dev/null' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -qx ok
          curl -fsS http://127.0.0.1:8080/models/ | grep -q '<base href="/models/" />'
          curl -fsS http://127.0.0.1:8080/models/w/hartland/s/er | grep -q '<base href="/models/" />'
          curl -fsS http://127.0.0.1:8080/models/config.json | grep -q '"basePath": "/models/"'
          curl -fsS http://127.0.0.1:8080/models/config.json | grep -q '"veles": "/models/veles"'
          curl -fsS http://127.0.0.1:8080/models/config.json | grep -q '"layoutFormat": "ttr"'
          set +e; docker run --rm -e VIEWER_LAYOUT_FORMAT=bogus ttr-viewer:smoke; refused=$?; set -e
          test "$refused" = 64
          ASSET=$(curl -fsS http://127.0.0.1:8080/models/ | grep -o 'assets/index-[^"]*\.js' | head -n1)
          curl -fsS -o /dev/null "http://127.0.0.1:8080/models/${ASSET}"
          # The same image also hosts the Studio iframe at its reserved entry, with shared assets.
          curl -fsS 'http://127.0.0.1:8080/m/_designer/index.html?backend=host' | grep -q '<base href="/m/_designer/" />'
          curl -fsS http://127.0.0.1:8080/m/_designer/ | grep -q '<base href="/m/_designer/" />'
          curl -fsS -o /dev/null "http://127.0.0.1:8080/m/_designer/${ASSET}"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/m/_designer/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/models/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/models)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/elsewhere)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/models/veles/model/index)" = 503
          test "$(docker exec viewer id -u)" = 101
          # The catalog proxy (VL contracts V-41): a stub Veles — this image's own nginx, answering every
          # request with what it was asked — behind a viewer with VIEWER_CATALOG_UPSTREAM set. The seven
          # read routes reach it, GET only, query string kept; nothing else under veles/ does.
          cat > "$RUNNER_TEMP/stub.conf" <<'CONF'
          pid /tmp/stub.pid;
          error_log /dev/stderr warn;
          events {}
          http {
              client_body_temp_path /tmp/c; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f;
              uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;
              access_log /dev/stdout;
              server {
                  listen 7260;
                  default_type application/json;
                  location / { return 200 '{"seen":"$request_method $request_uri"}'; }
              }
          }
          CONF
          docker network create smoke >/dev/null
          trap 'docker logs viewer; docker logs proxied || true; docker rm -f viewer stub proxied >/dev/null 2>&1; docker network rm smoke >/dev/null 2>&1' EXIT
          docker run -d --name stub --network smoke -v "$RUNNER_TEMP/stub.conf:/tmp/stub.conf:ro" --entrypoint nginx ttr-viewer:smoke -e /dev/stderr -c /tmp/stub.conf -g 'daemon off;'
          docker run -d --name proxied --network smoke -p 8081:8080 -e VIEWER_CATALOG_UPSTREAM=http://stub:7260 ttr-viewer:smoke
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1 && break; sleep 1; done
          for route in model/index model/graph model/object model/search model/layouts model/layout status; do
            curl -fsS "http://127.0.0.1:8081/veles/$route" | grep -qF "\"seen\":\"GET /$route\""
          done
          curl -fsS 'http://127.0.0.1:8081/veles/model/layout?name=sales' | grep -qF '"seen":"GET /model/layout?name=sales"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/veles/model/layout)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/veles/model/layouts)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/veles/model/layouts/sales)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/veles/model/export)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/veles/refresh)" = 404
          echo "smoke ok"

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/designer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
