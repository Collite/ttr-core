name: Publish Kotlin artifacts

# Publishes the modeler-owned Kotlin artifacts (org.tatrman:ttr-parser,
# ttr-writer, and — from Phase 2 — ttr-semantics) to GitHub Packages.
# Tag-driven, mirroring ai-platform's publish flow. See PUBLISHING.md and
# docs/grammar-master/contracts.md §6.1.
#
# Tag → modules (one tag per module family — RO-24; no module has two publishers).
# Renamed 2026-07-16 (justfile sync) from the old kotlin*/v prefixes — tag
# prefixes now match either the module's own directory name or an explicit,
# human-named bundle:
#   grammar/v<x.y.z>     bundle: THE unified TTR toolchain — ttr-parser + ttr-writer +
#                        ttr-semantics + ttr-metadata + ttr-metadata-git + ttr-snapshot +
#                        ttr-md-resolver + ttr-lexicon + ttr-lexicon-compile + ttr-lexicon-cli + ttr-metadata-cli.
#                        the TTR-P toolchain (AG-14) + ttr-concept (cn, CN-P3 S3.1 — A-CN-1).
#                        One `api` closure, one version, one tag.
#                        (was kotlin/v*; absorbed the metadata bundle 2026-07-30)
#   ttr-parser/v<x.y.z>  ttr-parser only                                  (was kotlin-parser/v*)
#   ttr-semantics/v<x.y.z> ttr-semantics only                             (was kotlin-semantics/v*)
#   ttr-writer/v<x.y.z>  ttr-writer only                                  (was kotlin-writer/v*)
#   metadata/v<x.y.z>    RETIRED 2026-07-30 — folded into grammar/v*. The trigger is kept so a
#                        stale tag FAILS LOUDLY instead of publishing the wrong module set.
#   translator/v<x.y.z>  bundle: ttr-plan-proto + ttr-translator (lockstep; ttr-translator
#                        extraction arc, docs/ttr-translator/architecture/contracts.md §5) (was kotlin-translator/v*)
#                        The cn protos (concept/statement/assertion v1) ride ttr-plan-proto here — frozen at
#                        CN-P3 S3.1. ttr-concept itself is NOT here: it `api`s ttr-metadata / ttrp-frontend, so
#                        on a translator tag its POM would name those at the TRANSLATOR version — versions the
#                        grammar line never cut. It publishes in grammar/v* (A-CN-1, since CN-P3 S3.1).
#   validator/v<x.y.z>   bundle: ttr-validator-spi (the ⑤ C-5-i plugin SPI, PL-P4.S2 — one module today,
#                        named a bundle so more validator artifacts can join its lockstep later)
#   security-gen/v<x.y.z> bundle: ttr-security-gen (the ⑤ H-1 security-block → Rego generator, PL-P4.S3;
#                        Perun consumes it as a PUBLISHED artifact, P2)
#
# Lane gating (SV — Central quota, 2026-07-13; polarity flipped 2026-07-16): EVERY
# tag publishes to the GitHub Packages staging lane. A tag additionally publishes
# to Maven Central ONLY when it carries an explicit `-RELEASE` marker (e.g.
# `grammar/v1.0.0-RELEASE`) — the marker is stripped before the version reaches
# any registry (Central gets bare `1.0.0`, same as GH Packages). Un-marked bare
# tags (`grammar/v0.9.5`) are now internal-only: most cuts are fast-iteration
# internal patches, so a public release must be marked explicitly rather than
# inferred from the absence of a prerelease suffix. Central's free tier
# (~1,167 files / ~78 MB / ~7 releases per month, 3-month rolling average) still
# can't absorb fast-iteration publishing. See PUBLISHING.md § Release lanes.

on:
  push:
    tags:
      - 'grammar/v*'
      - 'ttr-parser/v*'
      - 'ttr-semantics/v*'
      - 'ttr-writer/v*'
      - 'metadata/v*'
      - 'translator/v*'
      - 'validator/v*'
      - 'security-gen/v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # AG-14: a grammar tag pins ttr-translator to the latest `translator/v*` tag and diffs the
          # translator sources against it — both need the tags and their history.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version + modules from tag
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          RAW_VERSION="${TAG##*/v}"
          # -RELEASE is a tag-level marker only — strip it before the version
          # reaches any registry. Its presence, not the absence of a prerelease
          # suffix, is what gates the Central lane (2026-07-16 polarity flip).
          if [[ "$RAW_VERSION" == *-RELEASE ]]; then
            PUBLIC=true
            VERSION="${RAW_VERSION%-RELEASE}"
          else
            PUBLIC=false
            VERSION="$RAW_VERSION"
          fi
          if [[ "$TAG" == ttr-parser/v* ]]; then
            MODULES=":packages:kotlin:ttr-parser:publish"
          elif [[ "$TAG" == ttr-semantics/v* ]]; then
            MODULES=":packages:kotlin:ttr-semantics:publish"
          elif [[ "$TAG" == ttr-writer/v* ]]; then
            MODULES=":packages:kotlin:ttr-writer:publish"
          elif [[ "$TAG" == metadata/v* ]]; then
            # RETIRED 2026-07-30 — the metadata family is now part of the single `grammar/v*`
            # bundle. This branch stays only as a TRIPWIRE: a stale `metadata/v*` tag must fail
            # loudly rather than silently publish a half-family (the trigger above still fires,
            # so removing the branch would fall through to the grammar `else` and publish the
            # WRONG module set at a metadata version number).
            echo "::error::$TAG — the 'metadata' bundle no longer exists. The metadata family is published by the unified 'grammar/v*' bundle (one api closure, one version). Use: just publish bundle grammar. Delete this tag: git push --delete origin $TAG"
            exit 1
          elif [[ "$TAG" == translator/v* ]]; then
            MODULES=":packages:kotlin:ttr-plan-proto:publish :packages:kotlin:ttr-translator:publish"
          elif [[ "$TAG" == validator/v* ]]; then
            # The ⑤ C-5-i plugin SPI (PL-P4.S2) — one module today; the `validator` bundle is named so more
            # validator artifacts can join its lockstep later. Grammar-INDEPENDENT (not in the version-sync gate).
            MODULES=":packages:kotlin:ttr-validator-spi:publish"
          elif [[ "$TAG" == security-gen/v* ]]; then
            # The ⑤ H-1 security-block → Rego generator (PL-P4.S3) — Perun consumes it PUBLISHED (P2). Depends on
            # ttr-parser (grammar-coupled) but is NOT itself in the version-sync gate (its own bundle version line).
            MODULES=":packages:kotlin:ttr-security-gen:publish"
          else  # grammar/v* — THE unified TTR toolchain bundle: grammar + metadata family.
                #
                # UNIFIED 2026-07-30. These seven modules are ONE `api` closure:
                #   ttr-metadata     api-> ttr-parser, ttr-writer, ttr-semantics, ttr-md-resolver
                #   ttr-md-resolver  api-> ttr-parser, ttr-semantics
                #   ttr-snapshot     api-> ttr-metadata
                #   ttr-metadata-git api-> ttr-metadata
                #   ttr-lexicon-compile  api-> ttr-lexicon; implementation-> ttr-parser,
                #                        ttr-metadata, ttr-snapshot (RV-P1.2, joined 2026-08-03)
                # `implementation(project(...))` writes an exact runtime version into the POM too,
                # so the compiler is as coupled to this set as ttr-metadata is; ttr-lexicon rides
                # with it because the compiler `api`s it (a separate lane would be the 0.10.3
                # failure again — a POM naming a version nothing forced to be cut).
                # `api(project(...))` writes the EXACT version into the published POM, so any
                # version present in one half and absent from the other is an unresolvable build
                # for every consumer.
                #
                # Two separate tags let this break in TWO ways, and both actually happened:
                #
                #   1. DRIFT. metadata/v0.10.2 (07-26) and metadata/v0.10.3 (07-27) were cut
                #      alone while grammar sat at 0.10.1. Nothing forced them together, so
                #      ttr-metadata:0.10.3 shipped to Central referencing a ttr-parser:0.10.3
                #      that was never built.
                #   2. PARTIAL FAILURE. On 07-29 the 0.10.4 pair was cut as two tags:
                #      metadata/v0.10.4-RELEASE published, and grammar/v0.10.4-RELEASE's run
                #      FAILED (actions/runs/30438898653). Half a version shipped.
                #
                # Result: ttr-metadata 0.10.3 and 0.10.4 are permanently unresolvable on Central
                # (registry versions cannot be deleted), and pinning 0.10.3 broke
                # tatrman-platform's veles compile for three days, 2026-07-27 -> 07-30.
                #
                # One tag fixes both mechanisms: drift becomes arithmetically impossible (there
                # is one version line), and a failing run fails the WHOLE set instead of half —
                # all seven modules publish in a single Gradle invocation to a single Central
                # deployment bundle.
                #
                # Splitting the tags (RO-24) was itself a fix, for a double-PUBLISH race where
                # two bundles both published ttr-metadata. One tag with each module listed
                # EXACTLY ONCE resolves that too: no overlap, so no race.
            #
            # JOINED 2026-10-02 (AG-14): the TTR-P toolchain — ttrp-frontend, ttrp-graph, ttrp-emit,
            # ttrp-emit-spi, ttrp-conform, ttrp-cli (+ its `dist` zip, the self-contained CLI) and the
            # emit plugins ttrp-cli runs (ttr-emit-bash/-kestra/-airflow3). They `api`/`implementation`
            # ttr-metadata and friends exactly as the lexicon compiler does, so they share this version.
            # ttr-translator, which ttrp-emit `api`s, stays on its own line: the build PINS it to the
            # latest translator tag (-PtranslatorVersion, see build.gradle.kts) after checking the
            # translator sources have not moved since that tag — else the POMs would name a version
            # nothing published, or a published one that is not the code this build compiled against.
            MODULES=":packages:kotlin:ttr-parser:publish :packages:kotlin:ttr-writer:publish :packages:kotlin:ttr-semantics:publish :packages:kotlin:ttr-metadata:publish :packages:kotlin:ttr-metadata-git:publish :packages:kotlin:ttr-snapshot:publish :packages:kotlin:ttr-md-resolver:publish :packages:kotlin:ttr-lexicon:publish :packages:kotlin:ttr-lexicon-compile:publish :packages:kotlin:ttr-lexicon-cli:publish :packages:kotlin:ttr-metadata-cli:publish :packages:kotlin:ttrp-frontend:publish :packages:kotlin:ttrp-graph:publish :packages:kotlin:ttrp-emit:publish :packages:kotlin:ttrp-emit-spi:publish :packages:kotlin:ttrp-conform:publish :packages:kotlin:ttrp-cli:publish :packages:kotlin:ttr-emit-bash:publish :packages:kotlin:ttr-emit-kestra:publish :packages:kotlin:ttr-emit-airflow3:publish :packages:kotlin:ttr-concept:publish"
            TRANSLATOR=$(git tag -l 'translator/v*' | sed -E 's|^translator/v||; s/-RELEASE$//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            TRANSLATOR_TAG=$(git tag -l "translator/v${TRANSLATOR}" "translator/v${TRANSLATOR}-RELEASE" | head -1)
            if [ -z "$TRANSLATOR_TAG" ]; then
              echo "::error::no translator/v* tag found — the grammar bundle pins ttr-translator to its latest release"
              exit 1
            fi
            if ! git diff --quiet "$TRANSLATOR_TAG" HEAD -- \
                packages/kotlin/ttr-translator/src/main packages/kotlin/ttr-translator/build.gradle.kts \
                packages/kotlin/ttr-plan-proto/src/main packages/kotlin/ttr-plan-proto/build.gradle.kts; then
              echo "::error::ttr-translator / ttr-plan-proto changed since $TRANSLATOR_TAG — the grammar bundle would publish ttrp-emit against unreleased translator code. Cut a translator release first (just publish bundle translator), then re-tag the grammar bundle."
              exit 1
            fi
            EXTRA="-PtranslatorVersion=${TRANSLATOR}"
            echo "ttr-translator pinned to ${TRANSLATOR} (${TRANSLATOR_TAG}, sources unchanged)"
          fi
          # Version sync (2026-07-16): grammar-coupled artifacts share the grammar's
          # <major.minor>; the patch digit is code-only. Enforce it for the coupled tags.
          #
          # CORRECTED 2026-07-30: this comment used to claim "metadata/translator are
          # grammar-INDEPENDENT ... they follow the grammar minor by convention". That was
          # HALF WRONG, and the wrong half is what let 0.10.3 through. `ttr-metadata` `api`s the
          # grammar artifacts, so it is maximally grammar-COUPLED — convention was never enough.
          # It is now inside the `grammar/v*` bundle and therefore gated below like the rest.
          # Only `translator` (the plan protos) is genuinely grammar-independent; it may diverge
          # if the plan wire format needs its own break.
          case "$TAG" in
            grammar/v*|ttr-parser/v*|ttr-semantics/v*|ttr-writer/v*)
              GRAMMAR_MM=$(grep -m1 -oE '@grammar-version:[[:space:]]*[0-9]+\.[0-9]+' packages/grammar/src/TTR.g4 | grep -oE '[0-9]+\.[0-9]+')
              if [ "${VERSION%.*}" != "$GRAMMAR_MM" ]; then
                echo "::error::$TAG → $VERSION: minor ${VERSION%.*} must equal the grammar version $GRAMMAR_MM (grammar-coupled artifacts share the grammar's <major.minor> — new-grammar-version-process.md §6). Bump the grammar marker first, or fix the tag."
                exit 1
              fi
              echo "Version sync OK: ${VERSION%.*} == grammar $GRAMMAR_MM"
              ;;
          esac
          # SV-P1 S4 — the GH Packages step MUST target the GH-Packages-specific
          # publish task, NOT the generic `publish` aggregate: vanniktech registers
          # a `mavenCentral` repository, so `publish` now also pulls in
          # `prepareMavenCentralPublishing`, which demands `mavenCentralUsername` —
          # absent in the GH Packages step (it only has the GITHUB_TOKEN) → the whole
          # step fails before the Central lane can run. The Central lane runs the
          # separate `publishAndReleaseToMavenCentral` aggregate (uploads one signed
          # bundle and auto-releases it — no manual portal click).
          GH_MODULES="${MODULES//:publish/:publishAllPublicationsToGitHubPackagesRepository}"
          CENTRAL="${MODULES//:publish/:publishAndReleaseToMavenCentral}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "extra=${EXTRA:-}" >> "$GITHUB_OUTPUT"
          echo "modules=${GH_MODULES}" >> "$GITHUB_OUTPUT"
          echo "central=${CENTRAL}" >> "$GITHUB_OUTPUT"
          echo "public=${PUBLIC}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${VERSION} (public=${PUBLIC}); GH Packages: ${GH_MODULES}; Central: ${CENTRAL}"

      - name: Publish (GitHub Packages — staging lane)
        run: ./gradlew --no-configuration-cache -Pversion=${{ steps.ver.outputs.version }} ${{ steps.ver.outputs.extra }} ${{ steps.ver.outputs.modules }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SV-P1 S4 — public lane (RO-17). Uploads a signed bundle to the Central
      # Portal and AUTO-RELEASES it (`publishAndReleaseToMavenCentral`, enabled
      # 2026-07-12 after the first manual releases). Skipped until the four
      # credential secrets are set, so the GH Packages lane above stays green in
      # the interim. Secret names ARE the Gradle property names so they flow
      # straight through as `ORG_GRADLE_PROJECT_*` env.
      #
      # ALSO skipped unless the tag carried a `-RELEASE` marker (public=false
      # above) — un-marked internal patches stay on the GH Packages staging lane
      # to protect the Central monthly quota. Only a `-RELEASE` tag reaches Maven
      # Central, published there under the stripped bare x.y.z version.
      - name: Publish to Maven Central (Central Portal)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        if: ${{ env.ORG_GRADLE_PROJECT_mavenCentralUsername != '' && steps.ver.outputs.public == 'true' }}
        run: ./gradlew --no-configuration-cache -Pversion=${{ steps.ver.outputs.version }} ${{ steps.ver.outputs.extra }} ${{ steps.ver.outputs.central }}
