name: Conformance

# Catches TS↔Kotlin drift the moment either side changes shape — both the parser
# (AST structure) and the semantics layer (resolved-reference + diagnostic sets).
# Parallel jobs dump the shared fixtures; the diff jobs compare them byte-for-byte
# after normalisation. See docs/grammar-master/.

# NLS-P10 review: `master` is this repo's DEFAULT branch, and it was missing from
# both trigger lists — so between the workflow landing and 2026-08-13 this gate
# never ran, on a push OR a pull request (PRs target `master`). `main`/`v0` are
# kept for the historical/parallel lines.
on:
  push:
    branches: [master, main, v0]
  # Runs on EVERY PR (no paths filter): resolver/walker behaviour can change via
  # files outside the obvious paths (shared utils, re-exports), and a path-scoped
  # run would silently skip those — a green-by-omission gap. The jobs are fast;
  # correctness beats the saved minutes.
  pull_request:
    branches: [master, main, v0]

jobs:
  canonical-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      # Check the committed schemas before a build can refresh generated resources.
      - run: node packages/grammar/scripts/generate-canonical-schemas.mjs --check
      - run: node --test packages/grammar/tests/canonical-generation.test.mjs
      - name: Check release-tag fixtures ignore inherited Git settings
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/canonical-yaml-signing.gitconfig
          GIT_DIR: ${{ runner.temp }}/absent-canonical-yaml.git
          GIT_WORK_TREE: ${{ runner.temp }}/absent-canonical-yaml-tree
          GIT_INDEX_FILE: ${{ runner.temp }}/absent-canonical-yaml-index
          GIT_OBJECT_DIRECTORY: ${{ runner.temp }}/absent-canonical-yaml-objects
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: tag.gpgSign
          GIT_CONFIG_VALUE_0: 'true'
          GIT_CONFIG_PARAMETERS: "'commit.gpgsign'='true'"
        run: |
          printf '[commit]\n gpgsign = true\n[tag]\n gpgSign = true\n' > "$GIT_CONFIG_GLOBAL"
          node --test scripts/canonical-yaml-release-tag.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tatrman/grammar prebuild
      # Tests read committed twins, discover the current roster, and exercise missing-twin and
      # unhandled-shape failures. Do not invoke generateTwins here: expected data must be reviewed.
      - name: YAML AST and semantics conformance, fixed points and C-7 bytes
        run: ./gradlew :packages:kotlin:ttr-yaml:test :packages:kotlin:ttr-metadata:test --tests '*DefsJsonRoundTripSpec'
      # MW S3.4: every tests/conformance/dialect/<case> needs tree/ + canonical/ and both must load to one snapshot.
      - name: Dialect YAML trees load to their canonical twins
        run: ./gradlew :packages:kotlin:ttr-metadata:test --tests '*DialectConformanceSpec'
      - name: Package and exercise the real canonical YAML migration bridge
        run: |
          ./gradlew :packages:kotlin:ttr-yaml:installDist
          pnpm --filter '@tatrman/migrate...' build
          node --test scripts/yaml-migration.integration.test.mjs

      - name: Canonical YAML library publication and isolated artifact consumer
        run: |
          ./gradlew --no-configuration-cache -Pversion=0.22.0-SMOKE -I scripts/canonical-yaml-smoke.init.gradle :packages:kotlin:ttr-parser:publishAllPublicationsToYamlSmokeRepository :packages:kotlin:ttr-yaml:publishAllPublicationsToYamlSmokeRepository :packages:kotlin:ttr-yaml:verifyLibraryPublication
          node scripts/canonical-yaml-consumer.mjs 0.22.0-SMOKE --repository build/yaml-smoke-repository

  ts-dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Build the WHOLE workspace, not a hand-listed filter. The filter here used to be
      # `@tatrman/parser --filter @tatrman/semantics`, and `tsc` died on TS2307 before a
      # single fixture was dumped — so this job, and with it every diff job that needs its
      # artifacts, had been red on master since 2026-08-14 and the workflow had never
      # passed. Enumerating the missing packages is whack-a-mole: `packages/parser`'s
      # tsconfig includes `src/__tests__` (which imports `@tatrman/grammar`), semantics'
      # tests import `@tatrman/sql`, and `semantics/src/md-calc.ts` — SOURCE, not a test —
      # imports `@tatrman/md-catalog`. Verified from deleted dists: `pnpm -r build` then
      # `dump` + `dump-sem` succeed with no golden drift.
      - run: pnpm -r build
      - run: pnpm --filter @tatrman/conformance dump
      - run: pnpm --filter @tatrman/conformance dump-sem
      # Golden-baseline gate: the committed out-ts{,-sem}/ must match what the
      # current TS code regenerates. A diff here means someone changed TS dump
      # output without committing it — regenerate locally (`pnpm --filter
      # @tatrman/conformance dump-all`) and commit. This is what catches TS-side
      # drift (and co-drift) that the cross-language diff alone cannot.
      - name: Assert committed TS dumps are current
        run: |
          if ! git diff --exit-code -- tests/conformance/out-ts tests/conformance/out-ts-sem; then
            echo "::error::Committed conformance baseline is stale. Run 'pnpm --filter @tatrman/conformance dump-all' and commit tests/conformance/out-ts{,-sem}/."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ts-dumps
          path: tests/conformance/out-ts/
      - uses: actions/upload-artifact@v4
        with:
          name: ts-sem-dumps
          path: tests/conformance/out-ts-sem/

  kt-dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :packages:kotlin:ttr-parser:test --tests "*ConformanceSpec*"
      - uses: actions/upload-artifact@v4
        with:
          name: kt-dumps
          path: packages/kotlin/ttr-parser/build/conformance/kt/

  kt-sem-dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :packages:kotlin:ttr-semantics:test --tests "*SemanticsConformanceSpec*"
      - uses: actions/upload-artifact@v4
        with:
          name: kt-sem-dumps
          path: packages/kotlin/ttr-semantics/build/conformance/kt-sem/

  diff:
    needs: [ts-dump, kt-dump, kt-sem-dump]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: ts-dumps
          path: tests/conformance/out-ts/
      - uses: actions/download-artifact@v4
        with:
          name: ts-sem-dumps
          path: tests/conformance/out-ts-sem/
      - uses: actions/download-artifact@v4
        with:
          name: kt-dumps
          path: packages/kotlin/ttr-parser/build/conformance/kt/
      - uses: actions/download-artifact@v4
        with:
          name: kt-sem-dumps
          path: packages/kotlin/ttr-semantics/build/conformance/kt-sem/
      - run: pnpm --filter @tatrman/conformance diff
      - run: pnpm --filter @tatrman/conformance diff-sem

  py-dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # only for the ANTLR generate step; not shipped to consumers
      - name: Generate the ANTLR Python parser
        run: ./packages/python/ttr-parser/scripts/generate-python-parser.sh
      - name: Install ttr-parser (editable)
        run: pip install -e packages/python/ttr-parser
      - name: Dump fixtures → out-py/
        run: python tests/conformance/dump.py
      - uses: actions/upload-artifact@v4
        with:
          name: py-dumps
          path: tests/conformance/out-py/
      - name: Dump semantics fixtures → out-py-sem/
        run: python tests/conformance/dump_sem.py
      - uses: actions/upload-artifact@v4
        with:
          name: py-sem-dumps
          path: tests/conformance/out-py-sem/

  py-vs-ts:
    needs: [ts-dump, py-dump]
    runs-on: ubuntu-latest
    # BLOCKING again since 2026-08-31 (MS-P0 review-081). The advisory note this
    # replaces named the exact condition for the flip — "the moment the Python walker
    # implements both blocks" — and it now does: `semantics { }` (model + walker +
    # dumper, carrying lists and nested objects verbatim like the other two runtimes)
    # and `security { }` (the four structured §11 verbs). All 65 fixtures are
    # byte-identical to the TS golden, `59-semantics` / `60-semantics-db` /
    # `65-security` included. No allow-list was added, as the note required.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ts-dumps
          path: out-ts/
      - uses: actions/download-artifact@v4
        with:
          name: py-dumps
          path: out-py/
      # Byte-for-byte: the Python AST dump must equal the (freshly regenerated) TS
      # golden on every fixture. A diff means the Python walker drifted from TS.
      - name: Diff Python dumps against TS golden
        run: |
          if ! diff -ru out-ts/ out-py/; then
            echo "::error::Python AST conformance drift vs TS golden. Run 'python tests/conformance/dump.py' locally and fix the walker/dumper (never the golden)."
            exit 1
          fi

  py-sem-vs-ts:
    needs: [ts-dump, py-dump]
    runs-on: ubuntu-latest
    # BLOCKING again since 2026-08-31 (MS-P0 review-081). Its own extra reason is
    # gone too: `dump_sem.py` now skips `*-negative` directories, which are parser-
    # REJECT rosters covered by the negative specs and which `run-ts-sem.ts` and the
    # Kotlin harness have always skipped. Python was the outlier, not the TS golden.
    # 65 single-file + 3 multi-doc dumps, byte-identical.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ts-sem-dumps
          path: out-ts-sem/
      - uses: actions/download-artifact@v4
        with:
          name: py-sem-dumps
          path: out-py-sem/
      # Byte-for-byte: the Python semantics dump (resolved refs + portable
      # validator diagnostics + symbol qnames) must equal the TS golden on every
      # fixture — single files AND the multi-doc subdirectories. A diff means the
      # Python resolver/validator/stock drifted from TS.
      - name: Diff Python semantics dumps against TS golden
        run: |
          if ! diff -ru out-ts-sem/ out-py-sem/; then
            echo "::error::Python semantics conformance drift vs TS golden. Run 'python tests/conformance/dump_sem.py' locally and fix the resolver/validator/stock (never the golden)."
            exit 1
          fi
