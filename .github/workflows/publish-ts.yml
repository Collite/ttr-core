name: Publish TypeScript packages (npm)

# Tag-driven release of the canonical TTR grammar to PUBLIC npmjs under the
# @tatrman scope — the open-kit registry per FO ⚑1 (RULED 2026-07-18: A-managed;
# open kit + grammar → public npmjs @tatrman; the former @collite GitHub-Packages
# rewrite is RETIRED at FO-P0.S3). TypeScript consumers depend on a published,
# versioned package instead of vendoring a frozen copy of TTR.g4 — the same
# distribution story Kotlin gets via Maven (publish.yml) and Python via PyPI
# (publish-python.yml). See PUBLISHING.md § TypeScript and
# docs/features/grammar-master/new-grammar-version-process.md §§6-7.
#
# Tag → package:
#   ts-grammar/v<x.y.z>   →   @tatrman/grammar   (packages/grammar), public npmjs  (job `publish`)
#   lsp/v<x.y.z>          →   the open family the Studio consumes, @tatrman/{parser,tokens,edit,lsp}:
#                             four tarballs at one version, an internal GitHub release; public npmjs
#                             only on lsp/v<x.y.z>-RELEASE  (jobs `lsp-family`, `lsp-family-release`)
#   edit/v<x.y.z>         →   refused: edit is released only with its family (lsp/v*). The historical
#                             public edit/v0.1.0 stays valid.
#   designer/v<x.y.z>     →   refused: the Designer family moved to ttr-platform (D-33).
# The Designer family's GUI packages moved to ttr-platform (D-33, Studio Free); `designer/v0.1.3`
# was the last `designer/v*` release cut here, and that lane is gone.
#
# EXTERNAL CUT IS GATED (FO ⚑2 ruling, Bora 2026-07-18: external publish only
# after the whole pipeline is set up and VALIDATED). The grammar job only fires on
# a `ts-grammar/v*` tag push (a deliberate maintainer action) AND needs the
# `NPM_TOKEN` secret provisioned. FO-P0.S3 sets up + validates the machinery (the
# grammar-consumer-smoke CI job packs + installs the tarball locally, no publish);
# the first real public cut is a separate, deliberate step once Bora green-lights.

on:
  push:
    tags:
      - 'ts-grammar/v*'
      - 'lsp/v*'
      # Kept so a stray edit or designer tag fails loudly (jobs `edit-tag-refused`,
      # `designer-tag-refused`) instead of doing nothing.
      - 'edit/v*'
      - 'designer/v*'
  # A dry run of the lsp family lane from any ref: build, pack, consumer smoke; nothing is released.
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/*/package.json'
      - 'packages/lsp/scripts/build-package.mjs'
      - 'packages/edit/scripts/build-package.mjs'
      - 'scripts/*lsp*'
      - 'scripts/*family*'
      - 'scripts/prepare-*-package.mjs'
      - 'packages/lsp/src/**'
      - 'packages/parser/src/**'
      - 'packages/tokens/src/**'
      - 'packages/edit/src/**'
      - 'packages/format/src/**'
      - 'packages/lint/src/**'
      - 'packages/semantics/src/**'
      - 'packages/sql/src/**'
      - 'packages/sql/vendor/**'
      - 'packages/grammar/src/**'
      - 'packages/grammar/scripts/**'
      - 'packages/md-catalog/src/**'
      - 'packages/*/tsconfig*.json'
      - 'packages/*/LICENSE'
      - 'packages/*/NOTICE'
      - 'tsconfig.base.json'
      - 'LICENSE'
      - 'pnpm-lock.yaml'
      - '.github/workflows/publish-ts.yml'

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/ts-grammar/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # registry-url + scope make setup-node write the auth .npmrc that pnpm reads:
      #   @tatrman:registry=https://registry.npmjs.org/
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@tatrman'

      - run: pnpm install --frozen-lockfile

      # Runs the package's `prebuild` (extract-property-map.ts → generated/
      # {property-map,version}.ts from TTR.g4) then `tsc` → dist/. grammar is a
      # leaf package, so building it alone needs nothing else built first.
      - name: Build package and dependencies
        run: pnpm --filter "@tatrman/grammar..." run build

      - name: Derive version from the tag
        id: ver
        run: |
          prefix="ts-grammar/v"
          version="${GITHUB_REF_NAME#"$prefix"}"
          # -RELEASE is a tag-level marker only (2026-07-16, justfile sync) — the
          # published version must be a bare x.y.z.
          version="${version%-RELEASE}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "::error::could not derive version from tag '$GITHUB_REF_NAME' (expected ts-grammar/v<x.y.z>)"
            exit 1
          fi
          # Version sync: @tatrman/grammar's <major.minor> must equal the grammar's
          # own @grammar-version (the patch digit is code-only). See
          # new-grammar-version-process.md §6.
          GRAMMAR_MM=$(grep -m1 -oE '@grammar-version:[[:space:]]*[0-9]+\.[0-9]+' packages/grammar/src/TTR.g4 | grep -oE '[0-9]+\.[0-9]+')
          if [ "${version%.*}" != "$GRAMMAR_MM" ]; then
            echo "::error::grammar package minor must equal @grammar-version $GRAMMAR_MM"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing @tatrman/grammar $version"

      # Inject the tag version into the 0.0.0 placeholder. The name is already the
      # published name (@tatrman/grammar) — no rewrite needed under the @tatrman
      # scope on npmjs. Uses `npm pkg set` — pnpm 11 does NOT implement `pnpm pkg`
      # (ERR_PNPM_NOT_IMPLEMENTED). The repo copy is never committed with this value.
      - name: Set published version
        working-directory: packages/grammar
        run: npm pkg set version='${{ steps.ver.outputs.version }}'

      # Self-contained tarball guard (mirrors publish-python.yml's `unzip -l | grep`):
      # a consumer needs BOTH the raw .g4 (to regenerate its own parser) AND the
      # built exports (to import PROPERTY_MAP / TTR_GRAMMAR_VERSION). Fail loudly
      # if the `files` allow-list ever drops one. The grammar-consumer-smoke CI job
      # (ci.yml) runs this same pack + a real install on every PR, unpublished.
      - name: Verify the grammar tarball is self-contained
        working-directory: packages/grammar
        run: |
          tarball="$(pnpm pack | tail -1)"
          echo "packed: $tarball"
          list="$(tar -tzf "$tarball")"
          echo "$list"
          echo "$list" | grep -qx 'package/src/TTR.g4'                    || { echo "::error::TTR.g4 missing from tarball"; exit 1; }
          echo "$list" | grep -qx 'package/src/generated/version.ts'      || { echo "::error::generated/version.ts missing from tarball"; exit 1; }
          echo "$list" | grep -qx 'package/src/generated/property-map.ts' || { echo "::error::generated/property-map.ts missing from tarball"; exit 1; }
          echo "$list" | grep -qx 'package/dist/index.js'                 || { echo "::error::dist/index.js missing from tarball"; exit 1; }
          echo "$list" | grep -qx 'package/schemas/model-yaml.schema.json' || { echo "::error::model-yaml.schema.json missing from tarball"; exit 1; }
          echo "$list" | grep -qx 'package/schemas/profile.schema.json' || { echo "::error::profile.schema.json missing from tarball"; exit 1; }
          echo "$list" | grep -qx 'package/schemas/canonical-metadata.json' || { echo "::error::canonical-metadata.json missing from tarball"; exit 1; }
          tar -xzOf "$tarball" package/dist/index.js | grep -q 'TTR_GRAMMAR_VERSION' \
            || { echo "::error::dist/index.js does not re-export TTR_GRAMMAR_VERSION"; exit 1; }
          echo "Tarball is self-contained."

      # Public scoped package: first publish needs --access public. NPM_TOKEN is an
      # npmjs automation token with publish rights on the @tatrman scope (Bora
      # provisions once the tatrman npm org is claimed — bora-legal side item).
      - name: Publish to npmjs
        working-directory: packages/grammar
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  edit-tag-refused:
    # One publisher per coordinate (RO-24): @tatrman/edit is released only with its family.
    if: startsWith(github.ref, 'refs/tags/edit/v')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::edit is released only with the lsp family; use lsp/v* (just publish lsp set <version>)"
          exit 1

  designer-tag-refused:
    if: startsWith(github.ref, 'refs/tags/designer/v')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::the Designer family moved to ttr-platform (D-33, Studio Free); designer/v0.1.3 was the last tag here. ttr-core releases lsp/v* (just publish lsp)"
          exit 1

  lsp-family:
    # The four open packages the Studio consumes (D-33; design.md inv. 10), as one ordered closure at
    # one version. A bare lsp tag creates internal downloadable artifacts: tarballs + SHA256SUMS +
    # manifest.json, the shape ttr-platform's vendor check reads (R144-A(a)). Public npm is opt-in.
    # PRs and workflow_dispatch run this job only: the dry run, nothing released. It holds a read-only
    # token; the release itself is the next job's.
    # The locked Playwright browser installer supports Ubuntu 24.04, not the latest runner image.
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/lsp/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag before building
        if: github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#lsp/v}"
          version="${version%-RELEASE}"
          # Reads packages/lsp only: pack-lsp-family.mjs then asserts every member carries this version.
          expected=$(node -p "require('./packages/lsp/package.json').version")
          [ "$version" = "$expected" ] || { echo 'Tag must match the family manifests'; exit 1; }
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD origin/master || { echo 'Release must come from merged master'; exit 1; }
      - run: pnpm --filter '@tatrman/lsp...' --filter '@tatrman/tokens...' build
      - run: pnpm test:family
      - run: node scripts/prepare-family-licenses.mjs
      - run: git diff --exit-code -- 'packages/*/LICENSE' 'packages/*/NOTICE'
      - run: node scripts/pack-lsp-family.mjs
      - name: The family tarballs (the dry run's record)
        run: |
          jq -r '"lsp family " + .version + " @ " + .commit' build/lsp-family/manifest.json
          cat build/lsp-family/SHA256SUMS
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: node scripts/lsp-consumer-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-family
          path: |
            build/lsp-family/
            build/lsp-consumer/

  lsp-family-release:
    # A pushed lsp tag releases the artifact the job above built, packed and smoke-tested. The write
    # token lives in this job alone, which installs and builds nothing.
    needs: lsp-family
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lsp/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # The artifact's root is build/: lsp-family/ and lsp-consumer/ land where the job above wrote them.
      - uses: actions/download-artifact@v4
        with:
          name: lsp-family
          path: build
      - name: Internal GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --prerelease \
              --title "lsp family ${GITHUB_REF_NAME#lsp/v}" \
              --notes 'Install all four tarballs together with npm install ./tatrman-*.tgz. SHA256SUMS and manifest.json describe the artifacts. A bare tag is internal only; it does not publish to npm. See PUBLISHING.md for the external consumer recipe.'
          fi
          gh release upload "$GITHUB_REF_NAME" build/lsp-family/* --clobber
      - name: Public npm publication (explicit RELEASE tags only)
        if: endsWith(github.ref_name, '-RELEASE')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-lsp-family.mjs build/lsp-family
