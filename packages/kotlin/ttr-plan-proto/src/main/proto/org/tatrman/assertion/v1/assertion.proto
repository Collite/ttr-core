// SPDX-License-Identifier: Apache-2.0
// =============================================================================
// CN (conceptual model) v1 — `assertion.v1`, the WRITE frame (cn contracts §2.3; AM-7, AM-38)
//
// A processor proposes an Assertion — "this event happened, with these participants, qualities and period" —
// over concept IDs. `ttr-concept` validates it (labels, relation paths, units, the as-of), lowers it to the E-R row
// payload a ledger writes, and explains it as the inspector's sentence. **cn never executes a write**: the lowered
// payload is handed to whoever owns the write (a ledger / consolidation). Ambiguity is representable and
// refused at lowering (`cn/ambiguous-assertion`); negation/absence is a quality value, never a slot.
//
// JSON mapping: protobuf JsonFormat, canonical. ⚠ PRE-RELEASE (CN-P0 S0.4): `Assertion` and `Identity` are as
// contracts §2.3 pins them; the sub-message field sets it only sketches (KeyValues, Participant, QualityValue,
// Provenance) are provisional until CN-P3 S3.1 freezes the package — the J-v2 additive-only rule starts there.
// =============================================================================
syntax = "proto3";

package org.tatrman.assertion.v1;

import "org/tatrman/concept/v1/refs.proto";

option java_package = "org.tatrman.assertion.v1";
option java_multiple_files = true;

message Assertion {
  org.tatrman.concept.v1.ConceptRef event = 1;          // REQUIRED — the cn event that bears the claim
  Identity identity = 2;                                // known key values, or NEW (consolidation assigns)
  repeated Participant participants = 3;                // label = the event's involves label (validated, R-cn-5)
  repeated QualityValue qualities = 4;
  org.tatrman.concept.v1.Period period = 5;             // the occurrence's instant or the episode's interval
  org.tatrman.concept.v1.Instant asserted_as_of = 6;    // AM-38 (T-Q5): the instant the source claims the state FOR — separate from period; REQUIRED for state claims
  Provenance provenance = 7;
  string snapshot_hash = 8;
  string locale = 9;
  repeated string derived_from = 10;                    // ids of the assertions this one consolidates/corrects
}

message Identity {
  oneof how {
    KeyValues known = 1;
    bool new = 2;          // a NEW identity — known keys come only from source systems or humans
  }
}

// The event entity's key, attribute → value text.
message KeyValues {
  map<string, string> values = 1;
}

message Participant {
  string label = 1;                                     // an involves label of the event ("from", "to", "customer")
  org.tatrman.concept.v1.ConceptRef concept = 2;
  org.tatrman.concept.v1.MemberRef member = 3;
}

// Qualifiers an assertion carries (a certainty, a channel, …) are qualities too.
message QualityValue {
  org.tatrman.concept.v1.ConceptRef quality = 1;
  org.tatrman.concept.v1.Value value = 2;
  string unit = 3;                                      // cn never converts units (cn/unit-mismatch)
  string verbatim = 4;
}

message Provenance {
  string producer = 1;                                  // "au:synthesizer" · "kleio" · "manual:<steward>"
  string source_ref = 2;                                // doc://<doc-id>#<locator> (scheme pinned at CN-P5 S5.2)
  string run_id = 3;
  org.tatrman.concept.v1.Confidence confidence = 4;
  string verbatim = 5;
}
